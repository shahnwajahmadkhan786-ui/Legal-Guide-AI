services:
  - type: web
    name: nyayasahay
    runtime: node
    region: singapore   # Closest to India for lowest latency
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NVIDIA_API_KEY
        sync: false   # You will paste this manually in the Render dashboard
